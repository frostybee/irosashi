[package]
name = "kazari"
version = "0.1.0"
description = "Presentation layer for iro: fence meta, transformers, decorated HTML and Typst output"
edition.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[features]
markdown = ["dep:pulldown-cmark"]

[dependencies]
iro = { path = "../iro" }
pulldown-cmark = { version = "0.13", optional = true, default-features = false, features = ["html"] }
regex = "1"
serde.workspace = true
serde_yaml_ng = "0.10"
thiserror.workspace = true

[dev-dependencies]
insta = "1"
iro = { path = "../iro" }

[[example]]
name = "demo_markdown"
required-features = ["markdown"]
