[workspace]
members = [
    "crates/iro",
    "crates/kazari",
    "crates/iro-fidelity",
    "tools/sync-assets",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/frostybee/iro"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
