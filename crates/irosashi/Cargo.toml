[package]
name = "irosashi"
version = "0.1.0"
description = "TextMate grammar syntax highlighting with VS Code themes, byte-identical to vscode-textmate"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["embedded-assets"]
# Embed every bundled grammar and theme so `Highlighter::new()` needs no files on disk.
embedded-assets = ["dep:include_dir"]

[dependencies]
onig = { package = "onig-regset", version = "6", default-features = false }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
bitflags.workspace = true
include_dir = { version = "0.7", optional = true }

[dev-dependencies]
insta = "1"
