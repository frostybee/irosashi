[package]
name = "irosashi"
version = "0.3.2"
description = "TextMate grammar syntax highlighting with VS Code themes, byte-identical to vscode-textmate"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["syntax-highlighting", "textmate", "shiki", "vscode", "oniguruma"]
categories = ["text-processing", "parsing", "development-tools"]

[features]
default = ["embedded-assets"]
# Embed every bundled grammar and theme (deflated, inflated on first use) so
# `Highlighter::new()` needs no files on disk.
embedded-assets = ["dep:miniz_oxide"]

[dependencies]
ferroni = "2.9.1"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
bitflags.workspace = true
miniz_oxide = { version = "0.9", optional = true }

[build-dependencies]
miniz_oxide = { version = "0.9", optional = true }

[dev-dependencies]
insta = "1"
