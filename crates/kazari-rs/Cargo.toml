[package]
name = "kazari-rs"
version = "0.2.0"
description = "Presentation layer for irosashi: fence meta, transformers, decorated HTML and Typst output"
edition.workspace = true
license.workspace = true
repository = "https://github.com/frostybee/irosashi/tree/main/crates/kazari-rs"
readme = "README.md"
keywords = ["syntax-highlighting", "code-blocks", "html", "typst", "markdown"]
categories = ["text-processing", "web-programming"]

[features]
default = ["irosashi"]
irosashi = ["dep:irosashi"]
syntect = ["dep:syntect"]
markdown = ["dep:pulldown-cmark"]

[dependencies]
bitflags.workspace = true
irosashi = { version = "0.2", path = "../irosashi", optional = true }
syntect = { version = "5.3", optional = true, default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
    "plist-load",
] }
pulldown-cmark = { version = "0.13", optional = true, default-features = false, features = ["html"] }
regex = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
thiserror.workspace = true

[dev-dependencies]
insta = "1"

[[example]]
name = "demo"
required-features = ["irosashi"]

[[example]]
name = "demo_typst"
required-features = ["irosashi"]

[[example]]
name = "config_file"
required-features = ["irosashi"]

[[example]]
name = "demo_markdown"
required-features = ["markdown", "irosashi"]

[[example]]
name = "showcase"
required-features = ["markdown", "irosashi", "syntect"]

[[example]]
name = "backends"
required-features = ["markdown"]
