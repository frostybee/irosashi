[workspace]
members = [
    "crates/irosashi",
    "crates/kazari-rs",
    "crates/irosashi-fidelity",
    "tools/sync-assets",
    "tools/bench-report",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/frostybee/irosashi"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
bitflags = "2"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[profile.bench]
debug = 1
