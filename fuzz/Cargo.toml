[package]
name = "irosashi-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
irosashi = { path = "../crates/irosashi" }

[[bin]]
name = "parse_grammar"
path = "fuzz_targets/parse_grammar.rs"
